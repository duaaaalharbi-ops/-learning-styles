<!doctype html><html lang=ar dir=rtl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>أنماط التعلم</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7f7;color:#1f2937}main{max-width:760px;margin:auto;padding:16px}header{background:linear-gradient(135deg,#12354b,#147d7b);color:white;padding:24px;border-radius:20px}h1{margin:0 0 8px}section{background:white;margin-top:14px;padding:18px;border:1px solid #dfe7e7;border-radius:16px}select,button{width:100%;padding:13px;margin-top:8px;border-radius:10px;font:inherit}select{border:1px solid #ccd8d8;background:white}button{border:0;background:#147d7b;color:white;font-weight:700}.q{padding:14px 0;border-bottom:1px solid #eee}label{display:block;padding:9px;margin:6px 0;border:1px solid #e3e8e8;border-radius:10px}.hide{display:none}.bar{height:8px;background:#e8eeee;border-radius:9px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:0;background:#147d7b}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scores div{background:#f7f9f9;padding:10px;border-radius:10px;text-align:center}</style><main><header><h1>أنماط التعلم</h1><div>الثانوية الرابعة والتسعون – مسارات</div></header><section id=idCard><h2>اختيار الطالبة</h2><select id=stage><option value="">اختاري المرحلة</option><option>أول ثانوي</option><option>ثاني ثانوي</option><option>ثالث ثانوي</option></select><select id=cls disabled><option value="">اختاري الفصل</option></select><select id=student disabled><option value="">اختاري اسم الطالبة</option></select><button id=start>بدء الاستبانة</button></section><section id=quiz class=hide><h2>الاستبانة</h2><p>اختاري الإجابة الأقرب لطريقتك المعتادة.</p><div class=bar><i id=bar></i></div><div id=prog>0 من 10</div><div id=qs></div><button id=submit>إظهار النتيجة</button></section><section id=result class=hide><h2 id=title></h2><p id=desc></p><div class=scores id=scores></div><button id=again>تسجيل طالبة أخرى</button></section></main><script>const D={"أول ثانوي|1":["أرجوان علي عبده عسيري","اريام بنت ابراهيم بن موسى بن عبدالله المفضلي الزهراني","اسيل حامد محمد العتيبي","الماس عبدالله مقعد السبيعي","امجاد نامى بخيت السلمى","انهار عويتق عائش الحربي","ايناس بنت منور بن مستور المحمادي","بشاير بنت احمد بن محمد الحربي","تالا حمدان علي الشهري","تالين بنت فهد بن مقنع بن عطيه آل الصحبه المعلوي","جود نايف حميد المحياوي","جوري علي عبده عسيري","حسنة بنت سعيد بن رافع بن علي المفضلي الزهراني","حلا عبدالله معيض العتيبي","حنين حسين ابن علي الزييدي","دلال بنت جراد بن عبدالله ال جمعان المنتشري","رواسي بنت سعود بن ضحيان بن طلق المقاطي","روان سعد بن حسين البقمي","ريم حسين ابن علي الزييدي","ريم محمد أحمد السهيمي","سهام مخلد بن سعد السبيعي","شذى يحي سعيد الثبيتي","شمس محمد رجاء البقمي","شهد علي محمد الشهري","عبير بنت سالم بن علي بن محمد الزبيدي","غلا بنت تركي بن علي بن عبدالرحمن العلي الزهراني","غلاء عبدالله مهذل القحطاني","غيداء بنت ابراهيم بن سحيم بن ضيف الله المقاطي العتيبي","ملاك صليل شباب العتيبي","ملك بنت محمد بن صالح بن محمد ال درميح القرني","منى يحي احمد الزهراني","منيره عياف مطلق المرزوقي","نارمين بنت ساعد بن احمد بن محمد الزريبي الزبيدي","نهال بنت عايض بن سعيد بن محمد الاحمدي","نوره بنت راشد بن عبدالله بن سالم الوليدي"],"أول ثانوي|2":["ابتهال بنت هلال بن عطيه بن هلال ال غشيلي العصماني","أثير حسن علي البقمي","اريج سعود مساعد المحمادي","أمنيه نواف نامي المقاطي","ايناس نايف مساعد المحمادي","بشرى محمد طاهر","تمارا بنت عبدالله بنت ثابت المحمادي","تولين خالد ناصر الاسمري","جنان بنت راكان بن سعيد بن ناصر آل صالح الوادعي","جومانه نواف سليمان الجهني","حلا ناصر شهد العتيبي","رفيف بدر بدري السلمي","رهام احمد مشيرف المعلوي","ريانه بنت مطلق بن جعيري بن مطلق المخاريم الدوسري","ريتال بنت عبداللطيف بن مشعل بن عبدالرحمن الحجيري المعلوي","ريما محمد عايض البقمي","سجا محمد سهل العتيبي","سجى عويض معيوض السلمي","شروف مسلط بن سلطان السبيعي","غرور خالد حمد العتيبي","غلا بنت ستر بن شليويح الروقي العتيبي","غلا عوض صالح المالكي","فاطمة علي ناصر الحدري","لما حمدان جخيدب الجنيبي","لمار صالح محمد السلمي","لمار محمد علي الزبيدي","ليان سلطان محمد الربيعي","لينة بنت محسن بن سلطان بن احمد آل عاطف القرني","مايا عثمان عطيه الزهراني","منيره سلطان ثواب السبيعي","ميار سليم رضيان السلمي","ميرال عطيه بن عبدالله الغامدي","ناديه بنت نواف بن محمد بن عواد المحياوي","نوره بنت فهيد بن وعلان بن قشعان المجمعي السبيعي"]};const Q=[{"q":"عندما أتعلم معلومة جديدة، ما الذي يساعدني أكثر؟","o":[["رؤية صورة أو مخطط يوضحها","بصري"],["سماع شرح واضح عنها","سمعي"],["قراءة شرح مكتوب وتدوين الملاحظات","قراءة وكتابة"],["تجربتها أو تطبيقها بنفسي","حركي / تطبيقي"]]},{"q":"عندما أريد تذكّر معلومة مهمة، أميل إلى:","o":[["تخيّل شكلها أو مكانها في الصفحة","بصري"],["تكرارها بصوتي أو سماعها","سمعي"],["كتابتها أو تلخيصها","قراءة وكتابة"],["ربطها بتجربة أو نشاط قمت به","حركي / تطبيقي"]]},{"q":"في الحصة، أكثر ما يساعدني على الفهم:","o":[["الصور والرسوم والعروض","بصري"],["الشرح والنقاش الشفهي","سمعي"],["النصوص والملاحظات المكتوبة","قراءة وكتابة"],["الأنشطة والتطبيق العملي","حركي / تطبيقي"]]},{"q":"عندما أتعلم استخدام أداة أو برنامج جديد، أفضل:","o":[["مشاهدة الخطوات مصورة","بصري"],["سماع شخص يشرح الخطوات","سمعي"],["قراءة التعليمات خطوة بخطوة","قراءة وكتابة"],["تجربة الأداة مباشرة","حركي / تطبيقي"]]},{"q":"قبل الاختبار، الطريقة الأقرب لي في المراجعة:","o":[["الخرائط الذهنية والألوان","بصري"],["شرح الدرس بصوت مرتفع أو مناقشته","سمعي"],["كتابة الملخصات والقوائم","قراءة وكتابة"],["حل التدريبات والأسئلة التطبيقية","حركي / تطبيقي"]]},{"q":"إذا واجهت مفهومًا صعبًا، أول ما أفضله هو:","o":[["البحث عن رسم أو مثال بصري","بصري"],["طلب شرح شفهي","سمعي"],["قراءة شرح إضافي وكتابة أهم النقاط","قراءة وكتابة"],["تجربة مثال عملي عليه","حركي / تطبيقي"]]},{"q":"عند تعلم كلمات إنجليزية جديدة، أفضل:","o":[["ربط الكلمة بصورة أو لون","بصري"],["سماع نطقها وتكراره","سمعي"],["كتابتها مع معناها","قراءة وكتابة"],["استخدامها في موقف أو نشاط","حركي / تطبيقي"]]},{"q":"في مشروع جماعي، أميل أكثر إلى:","o":[["تنسيق العرض والصور","بصري"],["التحدث وعرض الأفكار","سمعي"],["كتابة المحتوى والتقرير","قراءة وكتابة"],["تنفيذ النموذج أو المهمة العملية","حركي / تطبيقي"]]},{"q":"إذا كان لدي وقت قصير جدًا لفهم درس جديد، أختار غالبًا:","o":[["مشاهدة ملخص بصري سريع","بصري"],["الاستماع إلى شرح مختصر","سمعي"],["قراءة ملخص وكتابة كلمات مفتاحية","قراءة وكتابة"],["حل مثال تطبيقي مباشرة","حركي / تطبيقي"]]},{"q":"إذا كان عليّ اختيار طريقة واحدة فقط لتعلّم موضوع جديد، سأختار:","o":[["رؤيته في صور ومخططات","بصري"],["سماعه ومناقشته","سمعي"],["قراءته وكتابة ملاحظات عنه","قراءة وكتابة"],["ممارسته وتطبيقه عمليًا","حركي / تطبيقي"]]}],T={"بصري":"تميلين إلى الاستفادة من الصور والمخططات والألوان والعروض المرئية.","سمعي":"تميلين إلى الاستفادة من الشرح الشفهي والنقاش والاستماع والتكرار الصوتي.","قراءة وكتابة":"تميلين إلى الاستفادة من النصوص والتلخيص والكتابة وتنظيم الملاحظات.","حركي / تطبيقي":"تميلين إلى الاستفادة من التجربة والممارسة والأنشطة والتطبيق العملي."};const e=x=>document.getElementById(x),stage=e("stage"),cls=e("cls"),student=e("student"),idCard=e("idCard"),quiz=e("quiz"),result=e("result"),qs=e("qs"),bar=e("bar"),prog=e("prog"),title=e("title"),desc=e("desc"),scores=e("scores");let S="",C="",N="";stage.onchange=()=>{S=stage.value;cls.innerHTML='<option value="">اختاري الفصل</option>';student.innerHTML='<option value="">اختاري اسم الطالبة</option>';student.disabled=true;cls.disabled=!S;if(S)for(let i=1;i<=6;i++)cls.innerHTML+=`<option>${i}</option>`};cls.onchange=()=>{C=cls.value;let a=D[S+"|"+C]||[];student.innerHTML='<option value="">اختاري اسم الطالبة</option>'+a.map(n=>`<option>${n}</option>`).join("");student.disabled=!C};e("start").onclick=()=>{N=student.value;if(!S||!C||!N)return alert("اختاري المرحلة والفصل واسم الطالبة.");idCard.classList.add("hide");quiz.classList.remove("hide");qs.innerHTML=Q.map((x,i)=>`<div class=q><b>${i+1}. ${x.q}</b>${x.o.map(o=>`<label><input type=radio name=q${i} value="${o[1]}"> ${o[0]}</label>`).join("")}</div>`).join("");qs.onchange=()=>{let n=Q.filter((_,i)=>document.querySelector(`input[name=q${i}]:checked`)).length;bar.style.width=n/10*100+"%";prog.textContent=n+" من 10"}};e("submit").onclick=()=>{let sc={"بصري":0,"سمعي":0,"قراءة وكتابة":0,"حركي / تطبيقي":0},a=[];for(let i=0;i<10;i++){let x=document.querySelector(`input[name=q${i}]:checked`);if(!x)return alert("أجيبي عن السؤال رقم "+(i+1));a.push(x.value);sc[x.value]++}let m=Math.max(...Object.values(sc)),c=Object.keys(sc).filter(k=>sc[k]==m),r=c.length==1?c[0]:c.includes(a[9])?a[9]:c.includes(a[8])?a[8]:["بصري","سمعي","قراءة وكتابة","حركي / تطبيقي"].find(x=>c.includes(x));title.textContent="نمط التعلم: "+r;desc.textContent=T[r];scores.innerHTML=Object.entries(sc).map(([k,v])=>`<div>${k}<br><b>${v}</b></div>`).join("");quiz.classList.add("hide");result.classList.remove("hide")};e("again").onclick=()=>location.reload()</script></html>
